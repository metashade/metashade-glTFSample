[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metashade-gltf-sample"
version = "0.1.2"
description = "glTF sample using metashade"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "metashade>=0.6.0",
    "pygltflib==1.16.5",
    "pytest>=9.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "black",
    "isort",
    "mypy"
]

[tool.pytest.ini_options]
testpaths = ["metashade/tests", "tests"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--strict-config"
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"